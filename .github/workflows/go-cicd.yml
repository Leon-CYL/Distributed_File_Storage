name: Go CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-build-artifact:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.23"

      - name: Run tests
        run: go test ./...

      - name: Build binary
        run: |
          mkdir -p bin
          go build -o bin/fs .

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: p2p-file-system-linux
          path: bin/fs